<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/3phor-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />

    <!-- Caveat, handwriting font used for the "Three worlds. One proof."
         tagline across the landing hero, end-game overlay, and
         in-app footer. Single weight (700) keeps the payload small;
         display=swap so layout doesn't wait on the font network
         hop. preconnect cuts ~100ms off the first fetch. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" />
    <meta name="theme-color" content="#1a1c18" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Search-engine crawl directives. max-image-preview:large lets
         Google use a full-size og-image card instead of a tiny thumbnail
         in search results, meaningful CTR uplift for branded queries. -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Primary SEO. Description trimmed to <160 chars so it shows
         in full in Google SERP without truncation. -->
    <title>Thresan™: Skyflag, Three worlds. One proof.</title>
    <meta name="description" content="Thresan: a free turn-based strategy game. Three layers. Four Lifts. One Nexus. Currently in its Skyflag edition. Play now." />
    <meta name="keywords" content="Thresan, Skyflag, Kaleo, strategy game, turn-based, board game, online, multiplayer, daily puzzle, chess-like, AI opponent, three-layer game, Grey Ravens, White Stags, Caelum Nexus" />
    <meta name="author" content="Limnology Research Corp." />
    <link rel="canonical" href="https://playskyflag.com/" />

    <!-- Open Graph (Facebook, LinkedIn, Discord, iMessage previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Thresan™: Skyflag" />
    <meta property="og:title" content="Thresan™: Skyflag, Three worlds. One proof." />
    <meta property="og:description" content="Thresan: a turn-based strategy game. Three layers. Four Lifts. One Nexus. Neutralize the opposing clan's three claim-seals, or guide your Captain to the Caelum Nexus. Free to play. Currently in its Skyflag edition." />
    <meta property="og:url" content="https://playskyflag.com/" />
    <meta property="og:image" content="https://playskyflag.com/thresan-og-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Thresan: Skyflag, three stacked boards, gold-on-dark wordmark, tagline 'Three worlds. One proof.'" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Thresan™: Skyflag, Three worlds. One proof." />
    <meta name="twitter:description" content="Thresan: a turn-based strategy game. Three layers. Four Lifts. One Nexus. Free to play. Currently in its Skyflag edition." />
    <meta name="twitter:image" content="https://playskyflag.com/thresan-og-card.jpg" />

    <!-- Schema.org structured data, helps Google render a rich card.
         Two separate JSON-LD blocks: a VideoGame entity for the game
         itself, and an Organization entity for the publisher (so
         "Limnology Research Corp." can show up as a knowledge panel
         eventually). Keeping them as two scripts keeps each entity
         independently parseable. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "VideoGame",
      "name": "Thresan™: Skyflag",
      "alternateName": "Thresan™: Skyflag",
      "description": "A turn-based strategy game set in Kaleo, the three-layer arcology. Neutralize the opposing clan's three claim-seals, or guide your Captain to the Caelum Nexus.",
      "url": "https://playskyflag.com/",
      "image": "https://playskyflag.com/og-image.png",
      "applicationCategory": "Game",
      "operatingSystem": "Web, iOS",
      "genre": ["Strategy", "Board Game", "Turn-Based"],
      "playMode": ["SinglePlayer", "MultiPlayer"],
      "numberOfPlayers": {
        "@type": "QuantitativeValue",
        "minValue": 1,
        "maxValue": 2
      },
      "inLanguage": "en",
      "gamePlatform": ["Web Browser", "iOS"],
      "publisher": {
        "@type": "Organization",
        "name": "Limnology Research Corp.",
        "url": "https://playskyflag.com/"
      },
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "availability": "https://schema.org/InStock"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Limnology Research Corp.",
      "url": "https://playskyflag.com/",
      "logo": "https://playskyflag.com/3phor-mark.png",
      "sameAs": ["https://github.com/PlaySkyFlag"]
    }
    </script>
  </head>
  <body>
    <!-- Static loading shell, visible immediately on first paint,
         even before the JS bundle parses. React replaces this with
         the real route once it mounts. If JS never runs (parse
         error, blocked network, etc.) the user sees this instead
         of a silent black screen. -->
    <div id="root">
      <div style="padding:24px;color:#ffd884;font-family:system-ui,-apple-system,sans-serif;text-align:center;font-size:1.1rem;margin-top:40px;letter-spacing:0.04em;">
        Loading Skyflag…
      </div>
    </div>

    <!-- Uncaught-error surface. If anything throws before React's
         ErrorBoundary mounts (module import error, syntax error in
         a chunk, blocked extension, etc.), this rewrites #root with
         a visible error card so the user can copy the message
         instead of staring at a void. Removed once we've identified
         and fixed any remaining init-time crashes. -->
    <script>
      (function () {
        // Stale-deploy auto-recovery. When Vercel redeploys, the HTML
        // referenced from the user's browser cache may point at chunk
        // hashes that no longer exist on the CDN. The dynamic import
        // then throws "Failed to fetch …" before React can mount. We
        // detect that pattern, do a one-shot reload to fetch the new
        // HTML (which references the current chunks), and only fall
        // through to the visible error card if reloading itself
        // didn't fix it (genuine bug, not stale deploy).
        // Storage key kept as '3phor.*' for backward compatibility, renaming
        // would lose the stale-deploy guard for existing users on first load
        // after the rebrand, causing a needless reload-loop window.
        var RELOAD_KEY = '3phor.stale-deploy-reloaded';
        function looksLikeStaleChunk(msg) {
          if (!msg) return false;
          var s = String(msg).toLowerCase();
          return (
            s.indexOf('failed to fetch') !== -1 ||
            s.indexOf('loading chunk') !== -1 ||
            s.indexOf('dynamically imported module') !== -1 ||
            s.indexOf('importing a module script') !== -1 ||
            s.indexOf('error loading module') !== -1
          );
        }
        function showError(message, filename, lineno) {
          var root = document.getElementById('root');
          if (!root) return;
          // Stale-deploy: try a single reload. sessionStorage flag
          // prevents an infinite loop if the error survives the
          // reload (meaning it's a real bug, not a cache mismatch).
          if (looksLikeStaleChunk(message) && !sessionStorage.getItem(RELOAD_KEY)) {
            try { sessionStorage.setItem(RELOAD_KEY, '1'); } catch (_) {}
            location.reload();
            return;
          }
          // Only replace if root still contains the static shell.
          // If React already replaced it, the error happened after
          // mount and an ErrorBoundary will handle it.
          if (!root.querySelector('[data-react-mounted]')) {
            root.innerHTML =
              '<div style="padding:22px 26px;margin:40px auto;max-width:560px;background:rgba(20,30,52,0.95);border:1px solid rgba(255,138,138,0.45);border-radius:14px;color:#f5f7fb;font-family:system-ui,-apple-system,sans-serif;line-height:1.5;">' +
              '<h2 style="margin:0 0 8px;font-size:1.2rem;color:#ff9a9a;">Skyflag, initial load failed</h2>' +
              '<p style="margin:0 0 12px;opacity:0.9;">The app hit a problem before React could start. Try a hard reload first (Cmd+Shift+R / Ctrl+Shift+R). If it keeps happening, the error below is the cause:</p>' +
              '<pre style="margin:0 0 14px;padding:10px 12px;background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.10);border-radius:8px;font:0.78rem ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word;max-height:30vh;overflow:auto;">' +
              String(message || 'unknown error') +
              (filename ? '\n  at ' + filename + ':' + (lineno || '?') : '') +
              '</pre>' +
              '<button onclick="location.reload()" style="padding:8px 14px;background:rgba(255,216,132,0.15);border:1px solid rgba(255,216,132,0.50);color:#ffd884;border-radius:8px;cursor:pointer;font:inherit;font-weight:600;">Reload</button>' +
              '</div>';
          }
        }
        window.addEventListener('error', function (e) {
          showError(e.message, e.filename, e.lineno);
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          showError((r && r.message) || String(r), r && r.fileName, r && r.lineNumber);
        });
        // Clear the reload flag once we're confident this load is
        // healthy, by the time the React app has been visible for a
        // second or two, the cycle is over. Done in window.load so
        // it runs after the entry chunk has at least started.
        window.addEventListener('load', function () {
          setTimeout(function () {
            try { sessionStorage.removeItem(RELOAD_KEY); } catch (_) {}
          }, 2000);
        });
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
    <noscript>
      <div style="padding:24px;color:#f5f3ee;font-family:system-ui,-apple-system,sans-serif;text-align:center;max-width:640px;margin:40px auto;">
        Skyflag needs JavaScript to run. Enable JavaScript and reload.
      </div>
    </noscript>
  </body>
</html>
