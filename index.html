<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/3phor-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1c18" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Search-engine crawl directives. max-image-preview:large lets
         Google use a full-size og-image card instead of a tiny thumbnail
         in search results — meaningful CTR uplift for branded queries. -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Primary SEO. Description trimmed to <160 chars so it shows
         in full in Google SERP without truncation. -->
    <title>3phor — Where strategists gather</title>
    <meta name="description" content="Free turn-based strategy game from the Caelum Chronicles universe. Three Layers. Four Lifts. One Nexus. Play now." />
    <meta name="keywords" content="3phor, Caelum Chronicles, Kaleo, strategy game, turn-based, board game, online, multiplayer, daily puzzle, chess-like, AI opponent, three-layer game, Grey Ravens, White Stags, Caelum Nexus" />
    <meta name="author" content="Limnology Research Corp." />
    <link rel="canonical" href="https://playskyflag.com/" />

    <!-- Open Graph (Facebook, LinkedIn, Discord, iMessage previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="3phor" />
    <meta property="og:title" content="3phor — Where strategists gather" />
    <meta property="og:description" content="A turn-based strategy game from the Caelum Chronicles universe. Three Layers. Four Lifts. One Nexus. Neutralize the opposing clan's three claim-seals, or guide your Captain to the Caelum Nexus. Free to play." />
    <meta property="og:url" content="https://playskyflag.com/" />
    <meta property="og:image" content="https://playskyflag.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="3phor — strategy across the three layers of Kaleo" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="3phor — Where strategists gather" />
    <meta name="twitter:description" content="Where strategists gather. Three Layers. Four Lifts. One Nexus." />
    <meta name="twitter:image" content="https://playskyflag.com/og-image.png" />

    <!-- Schema.org structured data — helps Google render a rich card.
         Two separate JSON-LD blocks: a VideoGame entity for the game
         itself, and an Organization entity for the publisher (so
         "Limnology Research Corp." can show up as a knowledge panel
         eventually). Keeping them as two scripts keeps each entity
         independently parseable. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "VideoGame",
      "name": "3phor",
      "alternateName": "3phor — Kaleo Edition",
      "description": "A turn-based strategy game set in Kaleo, the three-layer arcology. Neutralize the opposing clan's three claim-seals, or guide your Captain to the Caelum Nexus.",
      "url": "https://playskyflag.com/",
      "image": "https://playskyflag.com/og-image.png",
      "applicationCategory": "Game",
      "operatingSystem": "Web, iOS",
      "genre": ["Strategy", "Board Game", "Turn-Based"],
      "playMode": ["SinglePlayer", "MultiPlayer"],
      "numberOfPlayers": {
        "@type": "QuantitativeValue",
        "minValue": 1,
        "maxValue": 2
      },
      "inLanguage": "en",
      "gamePlatform": ["Web Browser", "iOS"],
      "publisher": {
        "@type": "Organization",
        "name": "Limnology Research Corp.",
        "url": "https://playskyflag.com/"
      },
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "availability": "https://schema.org/InStock"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Limnology Research Corp.",
      "url": "https://playskyflag.com/",
      "logo": "https://playskyflag.com/3phor-logo.png",
      "sameAs": ["https://github.com/PlaySkyFlag"]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
