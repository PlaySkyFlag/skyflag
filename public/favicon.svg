<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- SkyFlag favicon: three stacked layers + a gold flag.
       Reads at 16x16, 32x32, and Apple-touch-icon sizes.
       Dark rounded background mirrors the in-game palette;
       layer colours evoke Ground (tan), Sky (slate-blue),
       Space (deep blue). Gold flag = the win condition. -->

  <!-- Dark rounded background -->
  <rect width="64" height="64" rx="14" fill="#0a0e16"/>

  <!-- Subtle gold rim so the icon doesn't look flat -->
  <rect x="2" y="2" width="60" height="60" rx="13" fill="none"
        stroke="rgba(255, 216, 132, 0.18)" stroke-width="1"/>

  <!-- Three layers, top → bottom: Space, Sky, Ground -->
  <rect x="12" y="22" width="40" height="9" rx="2" fill="#3e5878"/>
  <rect x="12" y="33" width="40" height="9" rx="2" fill="#6585a8"/>
  <rect x="12" y="44" width="40" height="9" rx="2" fill="#9c7a55"/>

  <!-- Gold flag rising above the layers -->
  <rect x="18" y="8" width="2" height="16" fill="#ffd884"/>
  <path d="M 20 10 L 36 14 L 20 18 Z" fill="#ffd884"/>
</svg>
