<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Thresan sigil — mark of the Aetheri Law of Three.
       Three concentric arcs = three worlds.
       Three orbs on the central axis = three proofs.
       The axis = the Nexus.
       Aether Gold (#C2A46B) on Empyrean Indigo (#111826), per the brand
       palette. Simplified for legibility at 16×16 / 32×32. -->

  <!-- Empyrean Indigo background, rounded for iOS icon mask compatibility -->
  <rect width="64" height="64" rx="14" fill="#111826"/>

  <!-- Subtle gold rim — keeps the icon from looking flat against
       dark browser chrome -->
  <rect x="2" y="2" width="60" height="60" rx="13" fill="none"
        stroke="rgba(194, 164, 107, 0.22)" stroke-width="1"/>

  <!-- Central vertical axis — extends past the outermost arc top and
       bottom, matching the sigil's signature spike -->
  <line x1="32" y1="6" x2="32" y2="58" stroke="#C2A46B" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Three concentric arcs (rings). Stroke-only, no fill, so the
       dark background shows through. -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#C2A46B" stroke-width="1.4"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="#C2A46B" stroke-width="1.3"/>
  <circle cx="32" cy="32" r="7"  fill="none" stroke="#C2A46B" stroke-width="1.2"/>

  <!-- Three orbs on the central axis: top, center, bottom.
       Slightly larger center orb anchors the eye to the Nexus. -->
  <circle cx="32" cy="17" r="2.6" fill="#C2A46B"/>
  <circle cx="32" cy="32" r="3.0" fill="#C2A46B"/>
  <circle cx="32" cy="47" r="2.6" fill="#C2A46B"/>
</svg>
